<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" role="img" font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif" aria-label="A map of four social-theory accounts of how an aggregate becomes an entity, placed on two axes: structure-driven and illegible versus intention-driven and legible (horizontal), and instantaneous event versus longue-durée genesis (vertical).">
  <rect x="1" y="1" width="818" height="478" rx="10" fill="#efe9dd" stroke="#cdc6b7" stroke-width="1.5"/>

  <text x="410" y="40" text-anchor="middle" font-size="21" font-weight="500" fill="#221d18">四条「群体成为实体」的路径</text>
  <text x="410" y="62" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5c727d">Four accounts of how an aggregate of individuals becomes an entity</text>

  <!-- axes -->
  <g stroke="#977028" stroke-opacity="0.45" stroke-width="1.3">
    <line x1="410" y1="112" x2="410" y2="432"/>
    <line x1="128" y1="272" x2="692" y2="272"/>
  </g>
  <g fill="#977028" fill-opacity="0.6">
    <polygon points="410,100 404,113 416,113"/>
    <polygon points="410,444 404,431 416,431"/>
    <polygon points="116,272 129,266 129,278"/>
    <polygon points="704,272 691,266 691,278"/>
  </g>

  <!-- axis labels -->
  <g fill="#4a443b" font-size="13.5" font-weight="500">
    <text x="410" y="90" text-anchor="middle">瞬时 · 事件</text>
    <text x="410" y="462" text-anchor="middle">长时段 · 生成</text>
    <text x="108" y="268" text-anchor="end">结构驱动</text>
    <text x="108" y="286" text-anchor="end">不可读</text>
    <text x="712" y="268" text-anchor="start">意图驱动</text>
    <text x="712" y="286" text-anchor="start">可读</text>
  </g>

  <!-- Coleman : the origin / the one who poses the question -->
  <circle cx="410" cy="272" r="8" fill="#efe9dd" stroke="#7a2b25" stroke-width="2"/>
  <circle cx="410" cy="272" r="2.6" fill="#7a2b25"/>
  <line x1="398" y1="236" x2="406" y2="264" stroke="#7a2b25" stroke-opacity="0.4" stroke-width="1"/>
  <g text-anchor="end">
    <text x="395" y="214" font-size="14.5" font-style="italic" fill="#3f5560">Coleman 1990</text>
    <text x="395" y="233" font-size="13" fill="#221d18">提出问题 · 标定范畴</text>
  </g>

  <!-- Searle : declarative, instantaneous, legible -->
  <circle cx="600" cy="165" r="6.5" fill="#7a2b25"/>
  <g text-anchor="start">
    <text x="616" y="156" font-size="14.5" font-style="italic" fill="#3f5560">Searle 1995 / 2010</text>
    <text x="616" y="175" font-size="13" fill="#221d18">声明式 · 瞬时 · 可读</text>
  </g>

  <!-- Padgett &amp; Ansell : robust action, slow, illegible, structural (DONE) -->
  <circle cx="270" cy="330" r="10" fill="none" stroke="#977028" stroke-width="1.4"/>
  <circle cx="270" cy="330" r="6.5" fill="#7a2b25"/>
  <g text-anchor="end">
    <text x="254" y="326" font-size="14.5" font-style="italic" fill="#3f5560">Padgett &amp; Ansell 1993</text>
    <text x="254" y="345" font-size="13" fill="#221d18">稳健行动 · <tspan fill="#977028" font-weight="600">已完成</tspan></text>
  </g>

  <!-- Padgett &amp; Powell : emergence, longue-durée, cross-domain genesis (DONE) -->
  <circle cx="208" cy="392" r="10" fill="none" stroke="#977028" stroke-width="1.4"/>
  <circle cx="208" cy="392" r="6.5" fill="#7a2b25"/>
  <g text-anchor="start">
    <text x="150" y="412" font-size="14.5" font-style="italic" fill="#3f5560">Padgett &amp; Powell 2012</text>
    <text x="150" y="431" font-size="13" fill="#221d18">组织与市场的涌现 · <tspan fill="#977028" font-weight="600">已完成</tspan></text>
  </g>
</svg>
