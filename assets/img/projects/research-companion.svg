<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Research Companion — a six-phase session (Seed, Diverge, Evaluate, Deepen, Frame, Decide) ending in a Pursue, Refine, or Kill verdict">
  <defs>
    <linearGradient id="rc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#e6ddcb"/>
    </linearGradient>
    <marker id="rc-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0055aa"/>
    </marker>
  </defs>

  <rect width="400" height="250" fill="url(#rc-bg)"/>

  <!-- diverge: seed fans out into many ideas, then narrows down to one -->
  <g stroke="#6cb4ee" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 52 125 C 90 125, 100 60, 140 60"/>
    <path d="M 52 125 C 90 125, 100 92, 140 92"/>
    <path d="M 52 125 L 140 125"/>
    <path d="M 52 125 C 90 125, 100 158, 140 158"/>
    <path d="M 52 125 C 90 125, 100 190, 140 190"/>
  </g>

  <!-- candidate ideas; most are struck out by the critic -->
  <g>
    <circle cx="148" cy="60"  r="7" fill="#ffffff" stroke="#b9a98a" stroke-width="2"/>
    <circle cx="148" cy="92"  r="7" fill="#ffffff" stroke="#0055aa" stroke-width="2"/>
    <circle cx="148" cy="125" r="7" fill="#ffffff" stroke="#b9a98a" stroke-width="2"/>
    <circle cx="148" cy="158" r="7" fill="#ffffff" stroke="#0055aa" stroke-width="2"/>
    <circle cx="148" cy="190" r="7" fill="#ffffff" stroke="#b9a98a" stroke-width="2"/>
  </g>
  <g stroke="#b9a98a" stroke-width="2" stroke-linecap="round">
    <line x1="143" y1="55"  x2="153" y2="65"/><line x1="153" y1="55"  x2="143" y2="65"/>
    <line x1="143" y1="120" x2="153" y2="130"/><line x1="153" y1="120" x2="143" y2="130"/>
    <line x1="143" y1="185" x2="153" y2="195"/><line x1="153" y1="185" x2="143" y2="195"/>
  </g>

  <!-- survivors converge through deepen/frame into a decision -->
  <g stroke="#0055aa" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 156 92  C 200 92, 210 125, 250 125"/>
    <path d="M 156 158 C 200 158, 210 125, 250 125"/>
    <path d="M 250 125 L 286 125" marker-end="url(#rc-arrow)"/>
  </g>

  <!-- seed -->
  <circle cx="44" cy="125" r="10" fill="#0055aa"/>

  <!-- verdict card -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">
    <rect x="292" y="88" width="88" height="74" rx="6" ry="6" fill="#0b1f33"/>
    <text x="304" y="110" fill="#6cb4ee">✓ Pursue</text>
    <text x="304" y="130" fill="#d8cfbd">~ Refine</text>
    <text x="304" y="150" fill="#d8cfbd">✕ Kill</text>
  </g>

  <!-- phase labels -->
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#0b1f33" text-anchor="middle">
    <text x="44"  y="228">Seed</text>
    <text x="98"  y="228">Diverge</text>
    <text x="150" y="228">Evaluate</text>
    <text x="202" y="228">Deepen</text>
    <text x="254" y="228">Frame</text>
    <text x="336" y="228">Decide</text>
  </g>
  <line x1="30" y1="212" x2="370" y2="212" stroke="#b9a98a" stroke-width="1"/>
</svg>
