<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="Translation of Social Theory Works — loose individuals on the left coalescing into one bounded corporate entity on the right">
  <defs>
    <linearGradient id="stt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1ede4"/>
      <stop offset="100%" stop-color="#e7dcc6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="250" fill="url(#stt-bg)"/>

  <!-- LEFT: loose, unbound individuals -->
  <g stroke="#3f5560" stroke-opacity="0.22" stroke-width="1.1" fill="none" stroke-linecap="round">
    <line x1="40" y1="60" x2="80" y2="40"/>
    <line x1="80" y1="40" x2="120" y2="90"/>
    <line x1="60" y1="110" x2="95" y2="150"/>
    <line x1="30" y1="160" x2="70" y2="200"/>
    <line x1="120" y1="90" x2="150" y2="130"/>
    <line x1="95" y1="150" x2="110" y2="180"/>
    <line x1="60" y1="110" x2="120" y2="90"/>
  </g>
  <g fill="#5c727d" fill-opacity="0.85">
    <circle cx="40" cy="60" r="3.4"/><circle cx="80" cy="40" r="3.4"/>
    <circle cx="60" cy="110" r="3.4"/><circle cx="30" cy="160" r="3.4"/>
    <circle cx="95" cy="150" r="3.4"/><circle cx="70" cy="200" r="3.4"/>
    <circle cx="120" cy="90" r="3.4"/><circle cx="110" cy="180" r="3.4"/>
    <circle cx="150" cy="130" r="3.8"/>
  </g>

  <!-- FLOW: aggregation toward the entity -->
  <g stroke="#977028" stroke-opacity="0.5" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="150" y1="130" x2="244" y2="125"/>
    <line x1="120" y1="90"  x2="240" y2="105"/>
    <line x1="110" y1="180" x2="242" y2="148"/>
  </g>

  <!-- RIGHT: one bounded corporate entity (a membrane enclosing a self-binding network) -->
  <circle cx="300" cy="125" r="68" fill="#7a2b25" fill-opacity="0.06" stroke="#7a2b25" stroke-opacity="0.8" stroke-width="1.6"/>
  <g stroke="#977028" stroke-width="1.2" fill="none" stroke-linecap="round">
    <line x1="300" y1="125" x2="332" y2="125"/>
    <line x1="300" y1="125" x2="316" y2="153"/>
    <line x1="300" y1="125" x2="284" y2="153"/>
    <line x1="300" y1="125" x2="268" y2="125"/>
    <line x1="300" y1="125" x2="284" y2="97"/>
    <line x1="300" y1="125" x2="316" y2="97"/>
  </g>
  <g fill="#977028">
    <circle cx="332" cy="125" r="3.6"/><circle cx="316" cy="153" r="3.6"/>
    <circle cx="284" cy="153" r="3.6"/><circle cx="268" cy="125" r="3.6"/>
    <circle cx="284" cy="97" r="3.6"/><circle cx="316" cy="97" r="3.6"/>
  </g>
  <circle cx="300" cy="125" r="17" fill="none" stroke="#7a2b25" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2.5 2.5"/>
  <circle cx="300" cy="125" r="8" fill="#7a2b25"/>
</svg>
